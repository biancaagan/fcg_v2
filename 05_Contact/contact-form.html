    <!-- ----------------------- ----------------------- ----------------------- -->

    <main>

        <div class="page-header">
            <h1 class="page-title">Contact</h1>
            <hr>
        </div>

        <!-- CONTACT FORM -->
        <form class="contact-form" id="contact-form" method="POST" action="https://script.google.com/macros/s/AKfycbwjkkkBdTKHTm_6_IfsQL17uOan7vuz1eaiR5gPw3V3uWh5Ot_tkGEzXT4ZC7AOgIpqBw/exec">

            <div class="contact-container">
                <div class="contact-form-item required-field">
                    <label>Contact Name:</label>
                    <input type="text" name="Contact Name" placeholder="Your First and Last Name" required />
                </div>

                <div class="contact-form-item required-field">
                    <label>Contact email:</label>
                    <input type="text" name="Email" placeholder="Enter Email" required />
                </div>

                <div class="contact-form-item required-field">
                    <label>Contact phone:</label>
                    <input type="text" name="Phone Number" placeholder="Enter Phone Number" required />
                </div>

                <div class="contact-form-item required-field">
                    <select class="contact-form-show" name="Related Topic">
                        <option value="" disabled selected>Select Related Topic</option>
                        <option value="Rentals">Rentals</option>
                        <option value="Quote">Quote</option>
                        <option value="Show 1">Show 1</option>
                        <option value="Show 2">Show 2</option>
                        <option value="Show 3">Show 3</option>
                        <option value="Show 4">Show 4</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="contact-form-item">
                    <textarea class="contact-entry" name="Inquiry" style="height: 200px;"
                        placeholder="Write something..."></textarea>
                </div>

                <div class="contact-form-notes">
                </div>

                <!-- -------------------- SUBMIT BUTTON -------------------- -->
                <button type="submit" id="form-submit-button" class="submit-button center">SUBMIT</button>

                <!-- ----------------------- SUBMIT BUTTON SCRIPT ----------------------- -->
                <script>
                    // https://stackoverflow.com/questions/70767778/html-form-submission-to-google-sheets-using-apps-scripts-landing-thank-you-pag
                    window.addEventListener("load", function () {
                        const form = document.getElementById('contact-form');

                        form.addEventListener("submit", function (e) {
                            // Disable submit button after first click:
                            document.getElementById('form-submit-button').disabled = true;
                            document.getElementById('form-submit-button').textContent = 'Submitting...';

                            e.preventDefault();
                            const data = new FormData(form);
                            const action = e.target.action;
                            fetch(action, {
                                method: 'POST',
                                body: new FormData(form),
                                mode: 'no-cors'
                            })
                                .then(() => {
                                    // window.location.href = 'https://freqcoordgroup.com/wwwy25-submit';
                                    window.location.href = '/05_Contact/contact-submission-landing-page.html';
                                })
                        });
                    });
                </script>

            </div>
            </div>

            <!-- <div class="contact-container">
            Please email brooks@frequencycoordinationgroup.com with any questions or concerns.
        </div>" -->

        </form>
