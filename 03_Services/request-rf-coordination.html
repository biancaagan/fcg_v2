    <main>

        <div class="page-header">
            <h1 class="page-title">Request RF Coordination</h1>

        <!-- CONTACT FORM // but with details for request RF coordination -->
        <form class="contact-form" id="contact-form" method="POST"
            action="https://script.google.com/macros/s/AKfycbwjkkkBdTKHTm_6_IfsQL17uOan7vuz1eaiR5gPw3V3uWh5Ot_tkGEzXT4ZC7AOgIpqBw/exec">

            <div class="contact-container">
                <div class="contact-form-item required-field">
                    <label>Contact Name:</label>
                    <input type="text" name="Contact Name" placeholder="Your First and Last Name" required />
                </div>

                <div class="contact-form-item required-field">
                    <label>Contact email:</label>
                    <input type="text" name="Email" placeholder="Enter Email" required />
                </div>

                <div class="contact-form-item required-field">
                    <label>Contact phone:</label>
                    <input type="text" name="Phone Number" placeholder="Enter Phone Number" required />
                </div>

                <div class="contact-form-item">
                    <label>Topic:</label>
                    <input type="text" name="Related Topic" value="Request RF Coordination" readonly>
                </div>

                <!-- Items to be consolidated into hidden input as 'inquiry'-->
                <div class="contact-form-item required-field">
                    <label>Show Name:</label>
                    <input type="text" id="inq-show" placeholder="Show name" required />
                </div>

                <div class="contact-form-item  required-field">
                    <label>Show Location:</label>
                    <input type="text" id="inq-show-loc" placeholder="Show Location" required />
                </div>

                <div class="contact-form-item required-field">
                    <label>Onsite Start Date:</label>
                    <input type="date" id="inq-onsite-start" placeholder="Onsite Start Date" required />
                </div>

                <div class="contact-form-item required-field">
                    <label>Onsite End Date:</label>
                    <input type="date" id="inq-onsite-end" placeholder="Onsite End Date" required />
                </div>

                <div class="contact-form-item required-field">
                    <label>Scale of Show:</label>
                    <input type="text" id="inq-show-size" placeholder="Scale of Show" required />
                    <div class="contact-form-notes" style="color: gray;">
                        <i>&#40;Example: Expo floor, breakout rooms, X number of stages&#41;</i>
                    </div>
                </div>

                <div class="contact-form-item">
                    <label>Comments:</label>
                    <textarea class="contact-entry" id="inq-comments" style="height: 200px;"
                        placeholder="..."></textarea>
            </div>

            <!-- Hidden input to consolidate above entries into 'inquiry'-->
            <input type="hidden" name="Inquiry" id="Inquiry">



            <script>
                const fields = [
                    ['Show Name', 'inq-show'],
                    ['Show Location', 'inq-show-loc'],
                    ['Onsite Start Date', 'inq-onsite-start'],
                    ['Onsite End Date', 'inq-onsite-end'],
                    ['Scale of Show', 'inq-show-size'],
                    ['Comments:', 'inq-comments']
                ];

                function formatDate(v) {
                    if (!v) return '';
                    const [y, m, d] = v.split('-');
                    return `${m}/${d}/${y}`;
                }

                function combineInquiry() {
                    document.getElementById('Inquiry').value = fields
                        .map(([label, id, type]) => {
                            let value = document.getElementById(id).value.trim();
                            if (type === 'date') value = formatDate(value);
                            return `${label}: ${value}`;
                        })
                        .join('\n');
                }

                document.querySelector('form').addEventListener('submit', combineInquiry);
            </script>

            <!-- -------------------- SUBMIT BUTTON -------------------- -->
                <button type="submit" id="form-submit-button" class="submit-button center">SUBMIT</button>

                <!-- ----------------------- SUBMIT BUTTON SCRIPT ----------------------- -->
                <script>
                    // https://stackoverflow.com/questions/70767778/html-form-submission-to-google-sheets-using-apps-scripts-landing-thank-you-pag
                    window.addEventListener("load", function () {
                        const form = document.getElementById('contact-form');

                        form.addEventListener("submit", function (e) {
                            // Disable submit button after first click:
                            document.getElementById('form-submit-button').disabled = true;
                            document.getElementById('form-submit-button').textContent = 'Submitting...';

                            e.preventDefault();
                            const data = new FormData(form);
                            const action = e.target.action;
                            fetch(action, {
                                method: 'POST',
                                body: new FormData(form),
                                mode: 'no-cors'
                            })
                                .then(() => {
                                    // window.location.href = 'https://freqcoordgroup.com/wwwy25-submit';
                                    window.location.href = 'https://freqcoordgroup.com/contact-submit';
                                })
                        });
                    });
                </script>


            </div>


            <!-- <div class="contact-container">
            Please email brooks@frequencycoordinationgroup.com with any questions or concerns.
        </div>" -->

        </form>
